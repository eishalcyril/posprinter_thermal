# Local development overrides. This file is NOT part of the published package
# and is ignored by pub when posprinter_thermal is consumed as a dependency.
#
# It exists because the Android USB transport is maintained in ./patches and
# released separately as `posprinter_usb_android`. Consumers that install
# posprinter_thermal from pub.dev resolve that package from pub.dev normally.
dependency_overrides:
  posprinter_usb_android:
    path: patches/posprinter_usb_android
